name: CI

# Runs on pull requests only. The org "main: CI gate" ruleset requires the `ci`
# job below and an up-to-date branch, so the merged tree is the tree tested here
# and nothing reruns on develop. No paths filter: a workflow that never runs
# leaves the required check pending forever.
on:
  pull_request:
    branches: [develop]
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run ci:lint

      - name: Generate registry
        run: node scripts/gen-registry.js

      - name: Test
        run: npm test

  # test/pint.js checks convert-units against pint-check/reference.json. This job proves the
  # committed reference is what pint actually says for the committed unit map.
  pint-reference:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pint
        run: pip install -r pint-check/requirements.txt

      - name: Regenerate reference
        run: python -I pint-check/gen_reference.py

      - name: Reference is up to date
        run: git diff --exit-code pint-check/reference.json

  # The one check the org ruleset requires. A skipped required check counts as
  # passed, so the verdict reads every result rather than trusting needs: alone.
  ci:
    if: ${{ always() && !github.event.pull_request.draft }}
    needs: [lint-and-test, pint-reference]
    runs-on: ubuntu-latest
    steps:
      - name: Verdict
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for r in $RESULTS; do
            [ "$r" = success ] || { echo "::error::a required job ended $r"; exit 1; }
          done
