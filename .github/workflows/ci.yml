name: CI

on:
  push:
    branches: [ develop, main, master ]
  pull_request:
    branches: [ develop, main, master ]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run ci:lint

      - name: Generate registry
        run: node scripts/gen-registry.js

      - name: Test
        run: npm test

  # test/pint.js checks convert-units against pint-check/reference.json. This job proves the
  # committed reference is what pint actually says for the committed unit map.
  pint-reference:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pint
        run: pip install -r pint-check/requirements.txt

      - name: Regenerate reference
        run: python -I pint-check/gen_reference.py

      - name: Reference is up to date
        run: git diff --exit-code pint-check/reference.json
